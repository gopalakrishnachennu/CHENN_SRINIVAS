{% extends "base.html" %}
{% block page_title %}Audit{% endblock %}
{% block content %}
<div class="card">
  <table>
    <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead>
    <tbody>
    {% for e in events %}
      <tr>
        <td class="tiny">{{ e.timestamp }}</td>
        <td>{{ e.actor or '—' }}</td>
        <td class="mono">{{ e.action }}</td>
        <td>{{ e.entity_type }}</td>
        <td class="mono">{{ e.entity_id }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5" class="muted">No audit events.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
