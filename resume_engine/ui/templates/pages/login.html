<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Login — Resume Intelligence</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body style="min-height:100vh;display:grid;place-items:center;">
  <form class="card" method="post" action="{{ url_for('login') }}" style="width:min(420px,92vw);">
    <h1 class="page-title">Operator login</h1>
    <p class="muted">Resume Intelligence Control Center</p>
    <input type="hidden" name="next" value="{{ next_url }}"/>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <label>Username</label>
    <input type="text" name="username" value="{{ default_user }}" autocomplete="username" required/>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required/>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <button class="btn" type="submit" style="width:100%;margin-top:1rem;justify-content:center;">Sign in</button>
  </form>
</body></html>
