name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax / import check
        run: |
          python -m compileall resume_engine jd_blueprint_engine.py phase_1_jd_intelligence_blueprint.py phase_2_resume_pipeline.py
          python -c "import resume_engine.pipeline.phase2_pipeline"
          python -c "import resume_engine.llm.client"
          python -c "import resume_engine.learning.repository"

      - name: Unit + behavioral tests (no live OpenAI/Laya)
        env:
          RUN_LIVE_TESTS: "0"
        run: |
          pytest -m "not live" --tb=short

      - name: Ruff (non-blocking advisory)
        continue-on-error: true
        run: |
          ruff check resume_engine tests
