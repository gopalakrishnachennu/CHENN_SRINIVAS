[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chenn-srinivas-resume-engine"
version = "2.6.0"
description = "Phase 1/2 resume engine with Phase 2.6 correctness and learning hardening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "laya==0.3.5",
  "openai",
  "pydantic>=2.11,<3",
  "python-dotenv",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["resume_engine*"]

[tool.pytest.ini_options]
markers = [
  "unit: fast offline unit tests",
  "integration: multi-module offline integration tests",
  "behavioral: deterministic fixture behavioral suite",
  "live: opt-in live OpenAI/Laya tests (RUN_LIVE_TESTS=1)",
]
filterwarnings = [
  "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
